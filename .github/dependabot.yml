version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      worker-tooling:
        patterns: [wrangler, "@cloudflare/workers-types"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
