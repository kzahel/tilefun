version: 2

# Security updates only. Routine upgrades are maintainer-run batches.
# Dependabot requires a schedule, but open-pull-requests-limit: 0 disables
# version-update PRs without disabling security updates, which are grouped
# per ecosystem entry.
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
