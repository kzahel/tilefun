<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town pedestrians · Tilefun</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#253d36;font:16px/1.4 "Work Sans",system-ui,sans-serif}main{width:min(1050px,94vw);margin:0 auto 2rem}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #bbcbc1;padding:16px 0;color:#486052}h1{margin:18px 0 12px;font:600 clamp(1.9rem,5vw,3.15rem)/1.12 Georgia,serif;letter-spacing:-.04em}.stage{position:relative;overflow:hidden;border-radius:12px;background:#dbe5df}canvas{width:100%;height:clamp(215px,50vh,530px);display:block;touch-action:none}#loading{position:absolute;inset:40% 10% auto;text-align:center}.row{margin:12px 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.roster button{display:inline-flex;align-items:center;gap:5px}.roster img{width:18px;height:36px;image-rendering:pixelated}button{font:inherit;font-size:14px;line-height:1.3;cursor:pointer;color:inherit;border:1px solid #afc1b6;background:#fafaf5;border-radius:8px;padding:6px 10px;min-height:37px}button[aria-pressed=true]{color:#fff;background:#354e46;border-color:#354e46}button:focus-visible,a:focus-visible{outline:3px solid #937082}.actions{display:flex;justify-content:space-between;flex-wrap:wrap}p,nav{font-size:.87rem;color:#4e6559}a{color:#315b4b;margin-right:1rem}body.capture main{width:100vw;margin:0}body.capture main>:not(.stage){display:none}body.capture .stage,body.capture canvas{width:100vw;height:100vh;border-radius:0}
</style><main><header><strong>Tilefun</strong><span>Character studies</span></header><h1>Town pedestrians</h1>
<div class="roster row" role="group" aria-label="Character"><button data-id="0">All three</button>__ROSTER__</div>
<div class="stage"><canvas aria-label="3D pedestrian models. Drag to orbit or choose a camera angle."></canvas><p id="loading">Loading the models…</p></div>
<div class="actions"><div class="row" role="group" aria-label="Camera angle"><button data-angle="0">Front</button><button data-angle="30">Three-quarter</button><button data-angle="90">Side</button><button data-angle="180">Back</button><button data-angle="30" data-elevation="48">Above</button></div><div class="row" role="group" aria-label="Animation"><button data-motion="Idle">Idle</button><button data-motion="Walk">Walk</button></div></div>
<p>Choose a pedestrian for a closer look. Drag to rotate and pinch or scroll to zoom.</p><nav><a href="angle-sheet.jpg">Sprite comparison</a><a href="walk.mp4">Walking turntable</a><span id="files" hidden><a download>3D model</a><a download>Blender source</a></span></nav></main>
<script>if(location.hash==="#capture")document.body.className="capture"</script><script>__JS__</script></html>
