<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#1a1a2e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tilefun" />
		<title>Tilefun</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1a1a2e;
			}

			#game {
				display: block;
				width: 100%;
				height: 100%;
				image-rendering: pixelated;
				touch-action: none;
			}
            .startup-screen {
                position: fixed; inset: 0; z-index: 9000;
                display: grid; place-content: center; gap: 16px;
                padding: 24px; text-align: center; color: #f5f0d8;
                background: #1a1a2e; font: 18px system-ui, sans-serif;
            }
            .startup-screen[hidden], .startup-screen [hidden] { display: none; }
            .startup-screen h1 { font-size: 40px; color: #ffe38a; }
            .startup-screen progress { width: min(320px, 80vw); height: 18px; accent-color: #e9bf52; margin: auto; }
            .startup-detail { font-size: 14px; color: #b8c9c6; max-width: 480px; overflow-wrap: anywhere; }
            .startup-screen button { padding: 12px 20px; font: inherit; color: #fff; background: #243a32; border: 1px solid #9ab59c; border-radius: 8px; cursor: pointer; }

		</style>
	</head>
	<body>
		<canvas id="game"></canvas>
        <section id="startup-screen" class="startup-screen" data-stage="code" aria-label="Loading Tilefun" aria-busy="true">
            <h1>Tilefun</h1>
            <p id="startup-stage" role="status">Loading game code…</p>
            <progress id="startup-progress" aria-label="Loading progress"></progress>
            <p id="startup-detail" class="startup-detail">Getting the game ready to start.</p>
            <button id="startup-retry" type="button" hidden>Try again</button>
            <noscript>Enable JavaScript to play Tilefun.</noscript>
        </section>
        <script type="module" src="/src/bootstrap.ts"></script>
	</body>
</html>
