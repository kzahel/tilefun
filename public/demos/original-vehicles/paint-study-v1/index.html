<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tilefun · Vehicle paint studio</title>
    <link rel="stylesheet" href="gallery.css">
  </head>
  <body>
    <main>
      <header><p class="eyebrow">TILEFUN / VEHICLE PAINT STUDIO</p><h1>A little more color.</h1><p>Fourteen paint schemes, three familiar shapes. Compare them at game size, then look closer.</p></header>
      <section class="studio" aria-label="Selected paint scheme">
        <div class="controls">
          <label>Vehicle and paint <select id="paint"><option value="paint-beetle-butter-v1">Beetle · Butter yellow</option><option value="paint-beetle-cream-v1">Beetle · Warm cream</option><option value="paint-beetle-cherry-v1">Beetle · Cherry red</option><option value="paint-beetle-teal-v1">Beetle · Lagoon teal</option><option value="paint-beetle-powder-blue-v1">Beetle · Powder blue</option><option value="paint-beetle-forest-v1">Beetle · Forest green</option><option value="paint-pickup-teal-v1">Pickup · Lagoon teal</option><option value="paint-pickup-cherry-v1">Pickup · Farm red</option><option value="paint-pickup-forest-cream-v1">Pickup · Forest / cream roof</option><option value="paint-pickup-navy-cream-v1">Pickup · Navy / cream roof</option><option value="paint-rosso-coupe-cherry-v1">Sports coupe · Cherry red</option><option value="paint-rosso-coupe-butter-v1">Sports coupe · Butter yellow</option><option value="paint-rosso-coupe-powder-blue-v1">Sports coupe · Powder blue</option><option value="paint-rosso-coupe-navy-stripes-v1">Sports coupe · Navy / cream stripes</option></select></label>
          <label>View <select id="camera"><option value="engine">Game camera</option><option value="study">Elevated view</option></select></label>
          <label>Size <select id="scale"><option value="1">Native pixels</option><option value="2" selected>2× pixels</option><option value="3">3× pixels</option></select></label>
          <label>Background <select id="background"><option value="neutral">Neutral</option><option value="grass">Grass</option><option value="road">Road</option></select></label>
          <label class="heading">Heading <input id="heading" type="range" min="0" max="15" step="1" value="2"><output id="heading-label">45°</output></label>
        </div>
        <h2 id="selected-name">Loading paint schemes…</h2>
        <div id="stage" class="stage"><img id="selected-frame" alt="Selected vehicle paint scheme"></div>
        <div class="swatches" id="swatches"></div>
        <p id="view-note"></p><a id="model-link" href="paint-beetle-butter-v1/index.html">Explore the 3D model →</a>
      </section>
      <section aria-label="All paint schemes"><h2>The collection</h2><div class="cards"><button type="button" class="paint-card" data-id="paint-beetle-butter-v1"><img width="160" height="168" src="paint-beetle-butter-v1/thumbnail.png" alt="Beetle · Butter yellow"><span>Beetle · Butter yellow</span></button><button type="button" class="paint-card" data-id="paint-beetle-cream-v1"><img width="160" height="168" src="paint-beetle-cream-v1/thumbnail.png" alt="Beetle · Warm cream"><span>Beetle · Warm cream</span></button><button type="button" class="paint-card" data-id="paint-beetle-cherry-v1"><img width="160" height="168" src="paint-beetle-cherry-v1/thumbnail.png" alt="Beetle · Cherry red"><span>Beetle · Cherry red</span></button><button type="button" class="paint-card" data-id="paint-beetle-teal-v1"><img width="160" height="168" src="paint-beetle-teal-v1/thumbnail.png" alt="Beetle · Lagoon teal"><span>Beetle · Lagoon teal</span></button><button type="button" class="paint-card" data-id="paint-beetle-powder-blue-v1"><img width="160" height="168" src="paint-beetle-powder-blue-v1/thumbnail.png" alt="Beetle · Powder blue"><span>Beetle · Powder blue</span></button><button type="button" class="paint-card" data-id="paint-beetle-forest-v1"><img width="160" height="168" src="paint-beetle-forest-v1/thumbnail.png" alt="Beetle · Forest green"><span>Beetle · Forest green</span></button><button type="button" class="paint-card" data-id="paint-pickup-teal-v1"><img width="192" height="220" src="paint-pickup-teal-v1/thumbnail.png" alt="Pickup · Lagoon teal"><span>Pickup · Lagoon teal</span></button><button type="button" class="paint-card" data-id="paint-pickup-cherry-v1"><img width="192" height="220" src="paint-pickup-cherry-v1/thumbnail.png" alt="Pickup · Farm red"><span>Pickup · Farm red</span></button><button type="button" class="paint-card" data-id="paint-pickup-forest-cream-v1"><img width="192" height="220" src="paint-pickup-forest-cream-v1/thumbnail.png" alt="Pickup · Forest / cream roof"><span>Pickup · Forest / cream roof</span></button><button type="button" class="paint-card" data-id="paint-pickup-navy-cream-v1"><img width="192" height="220" src="paint-pickup-navy-cream-v1/thumbnail.png" alt="Pickup · Navy / cream roof"><span>Pickup · Navy / cream roof</span></button><button type="button" class="paint-card" data-id="paint-rosso-coupe-cherry-v1"><img width="162" height="176" src="paint-rosso-coupe-cherry-v1/thumbnail.png" alt="Sports coupe · Cherry red"><span>Sports coupe · Cherry red</span></button><button type="button" class="paint-card" data-id="paint-rosso-coupe-butter-v1"><img width="162" height="176" src="paint-rosso-coupe-butter-v1/thumbnail.png" alt="Sports coupe · Butter yellow"><span>Sports coupe · Butter yellow</span></button><button type="button" class="paint-card" data-id="paint-rosso-coupe-powder-blue-v1"><img width="162" height="176" src="paint-rosso-coupe-powder-blue-v1/thumbnail.png" alt="Sports coupe · Powder blue"><span>Sports coupe · Powder blue</span></button><button type="button" class="paint-card" data-id="paint-rosso-coupe-navy-stripes-v1"><img width="162" height="176" src="paint-rosso-coupe-navy-stripes-v1/thumbnail.png" alt="Sports coupe · Navy / cream stripes"><span>Sports coupe · Navy / cream stripes</span></button></div></section>
      <footer>Paint study for review. In-game vehicles retain their current colors.</footer>
    </main>
    <script src="gallery.js" defer></script>
  </body>
</html>
